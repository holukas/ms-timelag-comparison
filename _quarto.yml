project:
  type: website
  output-dir: _site
  # Render only these files, in this order (the old myst.yml TOC). Keeps stray
  # markdown like README.md out of the built site.
  render:
    - index.md
    - docs/time-lag.qmd
    - docs/data.md
    - notebooks/00_inventory.ipynb
    - notebooks/01_read_fluxes_to_parquet.ipynb
    - notebooks/02_level1_merged_analyzers.ipynb
    - notebooks/03_level1_merged_figures.ipynb
    - notebooks/04_level1_cumulative_fluxes.ipynb
    - notebooks/05_flux_processing_chain.ipynb
    - notebooks/08_merged_analyzers_full_year.ipynb
    - notebooks/09_cumulative_qc_fluxes.ipynb
    - notebooks/SUPPL_level1_lag_diagnostics.ipynb
    - docs/figure-gallery.md

website:
  title: "Time-lag settings & N₂O/CH₄ EC fluxes"
  description: >-
    Impact of different time-lag settings on eddy covariance fluxes of N₂O and CH₄.
  site-url: https://holukas.github.io/ms-timelag-comparison/
  repo-url: https://github.com/holukas/ms-timelag-comparison
  repo-actions: [source, issue]
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    right:
      - icon: github
        href: https://github.com/holukas/ms-timelag-comparison
        aria-label: GitHub
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - index.md
      - section: "Background & methods"
        contents:
          - docs/time-lag.qmd
          - docs/data.md
          - notebooks/00_inventory.ipynb
      - section: "Analysis notebooks"
        contents:
          - notebooks/01_read_fluxes_to_parquet.ipynb
          - notebooks/02_level1_merged_analyzers.ipynb
          - notebooks/03_level1_merged_figures.ipynb
          - notebooks/04_level1_cumulative_fluxes.ipynb
          - notebooks/05_flux_processing_chain.ipynb
          - notebooks/08_merged_analyzers_full_year.ipynb
          - notebooks/09_cumulative_qc_fluxes.ipynb
      - section: "Supplement"
        contents:
          - notebooks/SUPPL_level1_lag_diagnostics.ipynb
      - docs/figure-gallery.md
  page-footer:
    center: "Lukas Hörtnagl, ETH Zürich"

# Applied as default metadata to every page. `last-modified` reads each file's
# git commit date, so every page shows its own "last updated" date (this is the
# native feature Jupyter Book 2 lacked).
date: last-modified
date-format: "D MMMM YYYY"

bibliography: docs/references.bib

# Click any figure to open it zoomed in an overlay (lightbox). Applies to every
# image on the site, including the notebook output figures. Requires the
# quarto-ext/lightbox extension: run `quarto add quarto-ext/lightbox` once.
lightbox: auto

# Caption convention, applied to every page and every notebook output: table
# captions go above the table, figure captions below the figure. Bootstrap's own
# default puts <caption> at the bottom, so styles.css pins it back to the top for
# the raw HTML tables that come out of the notebooks.
fig-cap-location: bottom
tbl-cap-location: top

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-expand: true

# Never run notebook code at render time: use the outputs already committed in
# each .ipynb. The user runs the notebooks; Quarto only renders them.
execute:
  enabled: false
